name: Build umbriel + portal (Arch Linux packages)

# Compila en GitHub (no en tu máquina) y entrega paquetes .pkg.tar.zst listos
# para `sudo pacman -U`. Incluye:
#   - umbriel-git                    (el compositor)
#   - xdg-desktop-portal-umbriel-git (screencast / screenshot)
# xwayland-satellite ya está en los repos oficiales de Arch (extra),
# así que no hace falta compilarlo: `sudo pacman -S xwayland-satellite`.

on:
  workflow_dispatch:
    inputs:
      umbriel_branch:
        description: "Branch de noctalia-dev/umbriel"
        required: false
        default: "main"
      portal_branch:
        description: "Branch de noctalia-dev/xdg-desktop-portal-umbriel"
        required: false
        default: "main"
      publish_release:
        description: "Publicar también como GitHub Release (link de descarga directo, sin .zip)"
        type: boolean
        required: false
        default: false
  # Descomentá para recompilar automáticamente una vez por semana:
  # schedule:
  #   - cron: "0 6 * * 1"

permissions:
  contents: write   # necesario solo si publish_release = true

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel

    env:
      UMBRIEL_BRANCH: ${{ inputs.umbriel_branch || 'main' }}
      PORTAL_BRANCH: ${{ inputs.portal_branch || 'main' }}

    steps:
      - name: Preparar sistema y usuario de build
        run: |
          pacman -Syu --noconfirm --needed git sudo
          # makepkg no corre como root
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          chmod 0440 /etc/sudoers.d/builder
          install -d -o builder -g builder /home/builder/umbriel /home/builder/portal

      # ------------------------------------------------------------------
      # umbriel-git
      # ------------------------------------------------------------------
      - name: PKGBUILD de umbriel
        run: |
          cat > /home/builder/umbriel/PKGBUILD <<'EOF'
          # Maintainer: auto-generated by GitHub Actions
          pkgname=umbriel-git
          pkgver=0
          pkgrel=1
          pkgdesc='A Wayland compositor built on wlroots and SceneFX'
          arch=('x86_64')
          url='https://github.com/noctalia-dev/umbriel'
          license=('MIT')
          depends=(
            'wlroots0.20'
            'wayland'
            'libxkbcommon'
            'libinput'
            'pixman'
            'libdrm'
            'cairo'
            'pango'
            'libdisplay-info'
            'lcms2'
            'systemd-libs'
            'libxcb'
            'xcb-util-wm'
            'libglvnd'
            'mesa'
            'jemalloc'
          )
          makedepends=(
            'git'
            'meson'
            'ninja'
            'just'
            'pkgconf'
            'wayland-protocols'
            'tomlplusplus'
            'nlohmann-json'
          )
          optdepends=(
            'xwayland-satellite: X11 application support'
            'xdg-desktop-portal-umbriel-git: screen capture/sharing portal'
          )
          provides=('umbriel')
          conflicts=('umbriel')
          options=('!debug')
          source=("umbriel::git+https://github.com/noctalia-dev/umbriel.git#branch=@BRANCH@")
          sha256sums=('SKIP')

          pkgver() {
            cd umbriel
            local v
            v="$(head -n1 VERSION | tr -d '[:space:]' | sed 's/^v//; s/-/./g')"
            printf '%s.r%s.g%s' "${v:-0}" \
              "$(git rev-list --count HEAD)" \
              "$(git rev-parse --short HEAD)"
          }

          prepare() {
            cd umbriel
            # Fork parcheado de SceneFX (subprojects/scenefx)
            git submodule update --init --recursive
          }

          build() {
            cd umbriel
            meson setup build --buildtype=release --prefix=/usr
            meson compile -C build
          }

          package() {
            cd umbriel
            meson install -C build --skip-subprojects --destdir "$pkgdir"
            install -Dm644 LICENSE "$pkgdir/usr/share/licenses/$pkgname/LICENSE"
          }
          EOF
          sed -i "s|@BRANCH@|${UMBRIEL_BRANCH}|" /home/builder/umbriel/PKGBUILD
          chown builder:builder /home/builder/umbriel/PKGBUILD

      - name: Compilar umbriel
        run: |
          su builder -c 'cd /home/builder/umbriel && MAKEFLAGS="-j$(nproc)" makepkg -s --noconfirm --needed'

      # ------------------------------------------------------------------
      # xdg-desktop-portal-umbriel-git
      # ------------------------------------------------------------------
      - name: PKGBUILD del portal
        run: |
          cat > /home/builder/portal/PKGBUILD <<'EOF'
          # Maintainer: auto-generated by GitHub Actions
          pkgname=xdg-desktop-portal-umbriel-git
          pkgver=0
          pkgrel=1
          pkgdesc='xdg-desktop-portal backend (ScreenCast, Screenshot) for Umbriel'
          arch=('x86_64')
          url='https://github.com/noctalia-dev/xdg-desktop-portal-umbriel'
          license=('MIT')
          depends=(
            'xdg-desktop-portal'
            'sdbus-cpp'
            'libpipewire'
            'pipewire'
            'wayland'
            'libdrm'
            'mesa'
            'cairo'
            'gtk4'
          )
          makedepends=(
            'git'
            'meson'
            'ninja'
            'just'
            'pkgconf'
            'wayland-protocols'
            'tomlplusplus'
          )
          provides=('xdg-desktop-portal-umbriel')
          conflicts=('xdg-desktop-portal-umbriel')
          options=('!debug')
          source=("portal::git+https://github.com/noctalia-dev/xdg-desktop-portal-umbriel.git#branch=@BRANCH@")
          sha256sums=('SKIP')

          pkgver() {
            cd portal
            printf '0.r%s.g%s' \
              "$(git rev-list --count HEAD)" \
              "$(git rev-parse --short HEAD)"
          }

          prepare() {
            cd portal
            git submodule update --init --recursive
          }

          build() {
            cd portal
            meson setup build --buildtype=release --prefix=/usr
            meson compile -C build
          }

          package() {
            cd portal
            meson install -C build --destdir "$pkgdir"
            for f in LICENSE LICENSE.md COPYING; do
              if [ -f "$f" ]; then
                install -Dm644 "$f" "$pkgdir/usr/share/licenses/$pkgname/$f"
                break
              fi
            done
          }
          EOF
          sed -i "s|@BRANCH@|${PORTAL_BRANCH}|" /home/builder/portal/PKGBUILD
          chown builder:builder /home/builder/portal/PKGBUILD

      - name: Compilar portal
        run: |
          su builder -c 'cd /home/builder/portal && MAKEFLAGS="-j$(nproc)" makepkg -s --noconfirm --needed'

      # ------------------------------------------------------------------
      # Entrega
      # ------------------------------------------------------------------
      - name: Reunir paquetes
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp /home/builder/umbriel/*.pkg.tar.zst /home/builder/portal/*.pkg.tar.zst "$GITHUB_WORKSPACE/out/"
          cd "$GITHUB_WORKSPACE/out"
          sha256sum *.pkg.tar.zst > SHA256SUMS
          ls -lh
          for p in *.pkg.tar.zst; do
            echo "=== $p ==="
            pacman -Qip "$p"
            pacman -Qlp "$p"
          done

      - name: Subir artifact
        uses: actions/upload-artifact@v4
        with:
          name: umbriel-arch-packages
          path: |
            out/*.pkg.tar.zst
            out/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

      - name: Publicar GitHub Release (opcional)
        if: ${{ inputs.publish_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: arch-${{ github.run_number }}
          name: Arch packages #${{ github.run_number }}
          files: |
            out/*.pkg.tar.zst
            out/SHA256SUMS
